# İpek Tuhafiye — tek komutla test/canlı kurulum (Uygulama + MySQL 8.4)
# Kullanım:  docker compose up -d --build
# Takip:     docker compose logs -f app
services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tuhafiye_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tuhafiye}
      MYSQL_USER: ${MYSQL_USER:-tuhafiye}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tuhafiye}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-tuhafiye_root}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-tuhafiye}:${MYSQL_PASSWORD:-tuhafiye}@mysql:3306/${MYSQL_DATABASE:-tuhafiye}
      STOCK_RESERVATION_MINUTES: ${STOCK_RESERVATION_MINUTES:-15}
      PORT: "3000"
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  mysql-data:
